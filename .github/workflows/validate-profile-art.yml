name: Validate profile art

on:
  pull_request:
    paths:
      - "README.md"
      - "*.svg"
      - "scripts/**"
      - "tests/**"
      - "data/**"
      - ".github/workflows/**"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-art-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/requirements.txt

      - name: Compile scripts and tests
        run: python -m compileall -q scripts tests

      - name: Run regression tests
        run: python -m unittest discover --start-directory tests --top-level-directory . -v

      - name: Validate checked-in SVG XML
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          for name in ("avi-ascii.svg", "info-card.svg", "contrib-heatmap.svg"):
              ET.parse(Path(name))
              print(f"Validated {name}")
          PY
