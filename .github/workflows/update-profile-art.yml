name: Refresh animated profile art

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: profile-art-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/requirements.txt

      - name: Compile Python scripts
        run: python -m compileall -q scripts

      - name: Fetch avatar and public contribution data
        env:
          GH_PROFILE_USER: jelome265
        run: |
          python scripts/fetch_avatar.py
          python scripts/fetch_contributions.py

      - name: Render the self-hosted SVGs
        run: |
          python scripts/make_ascii_svg.py
          python scripts/make_info_card.py
          python scripts/render_heatmap_svg.py

      - name: Validate generated SVG files
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          for name in ("avi-ascii.svg", "info-card.svg", "contrib-heatmap.svg"):
              ET.parse(Path(name))
              print(f"Validated {name}")
          PY

      - name: Commit generated artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add avi-ascii.svg info-card.svg contrib-heatmap.svg data/contributions.json
          if git diff --cached --quiet; then
            echo "Generated artwork is already current."
          else
            git commit -m "chore: refresh profile art [skip ci]"
            git push
          fi
